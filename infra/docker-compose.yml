# CORREGIDO (estado "después" de la demo).
services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # Solo el puerto de la app y solo en localhost; un proxy publica hacia afuera si hace falta.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
